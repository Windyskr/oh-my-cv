name = "ohmycv-auth"
main = "worker/index.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./site/.output/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ohmycv-auth-db"
database_id = "09d64098-ce7c-4475-ac0e-4adfcb784992"
migrations_dir = "migrations"
remote = true

[triggers]
crons = ["0 0 * * *"]
