gist:
  title: GitHub Gist Sync
  description: Sync this resume's Markdown, CSS and all layout settings.
  create_token: "Open GitHub to create a classic token"
  token_help: Classic tokens need the gist scope; fine-grained tokens need Gists read and write permission. The token is sent only to GitHub.
  remember: "Remember the access token in this browser"
  address: "Resume Gist URL (optional on first upload)"
  address_help: Leave blank to create a secret Gist on first upload. Use the same URL on another device to download.
  secret_help: Anyone with a secret Gist link can access it. Keep your link safe. History is excluded; embed images or use accessible image URLs.
  upload: Upload to Gist
  download: Download from Gist
  forget: Clear sync settings
  working: Syncing, please wait…
  open: View Gist on GitHub
  uploaded: Full resume uploaded. Copy the Gist URL to sync on another device.
  downloaded: Resume downloaded and saved.
  confirm_download: This replaces the current Markdown, CSS and layout settings. Local file mode keeps history; the regular editor keeps a resume copy.
  replace: Replace current resume
  cancel: Cancel
  confirm_upload: This will overwrite the resume file in this Gist. Continue?
  confirm_public_upload: This Gist is public. Anyone will be able to view your uploaded resume. Continue?
  access_title: "Enter your GitHub access token"
  token_step_name: "On GitHub, enter Oh My CV in Note and choose an Expiration date."
  token_step_scope: "Under Select scopes, select gist. The link above preselects this permission."
  token_step_copy: "Click Generate token, copy the generated ghp_… value and paste it below."
  token_label: "Access token (required for upload)"
  token_placeholder: "Paste the ghp_… token generated by GitHub"
  show_token: "Show access token"
  hide_token: "Hide access token"
  token_persistent: "Settings save automatically. Your token is stored as plain text in this browser and sent only to GitHub."
  token_session: "The Gist URL is saved automatically. Your token stays in this page only; enter it again after reloading or closing the page."
  other_token: "Already have a fine-grained token?"
  location_title: "Choose where to store your resume"
  first_device: "First time:"
  first_device_help: "Leave the URL empty and click Create Gist and upload. The new URL is filled in automatically; no need to create a Gist beforehand."
  another_device: "On another device:"
  another_device_help: "Copy the Gist URL from your original device, paste it here and click Download from Gist."
  address_placeholder: "https://gist.github.com/username/gist-id"
  address_invalid: "Enter a gist.github.com URL or Gist ID here. Paste your access token in the Token field above."
  copy_address: "Copy URL"
  copied: "Copied"
  target_set: "Uploads and downloads will use this Gist. Copy its URL to another device."
  target_new: "No URL selected. Your first upload will create a secret Gist automatically."
  action_title: "Choose a sync direction"
  upload_direction: "Current resume → GitHub"
  upload_help: "Update the cloud resume with your current edits."
  create_help: "Create a Gist in your GitHub account and save the current resume."
  create_upload: "Create Gist and upload"
  upload_needs_token: "Complete step 1 by entering an access token."
  download_direction: "GitHub → Current resume"
  download_help: "Read the cloud resume, then confirm replacement. A copy of your current content is preserved."
  download_needs_address: "Enter an existing Gist URL in step 2 first."
  sync_notes: "Synced content and link access"
  errors:
    invalid_id: Enter a valid gist.github.com URL or Gist ID.
    token_required: Enter a GitHub token with Gist write permission.
    unauthorized: The token is invalid or expired. Please create a new one.
    forbidden: GitHub rejected the request. Check Gist permissions and API rate limits.
    not_found: Gist not found. Check its URL and your token's access.
    request_failed: Sync failed. Your current resume is preserved. Please retry later.
    network: Cannot connect to GitHub or the request timed out. Check your connection.
    invalid_data: The Gist resume format or content is invalid. Your current resume is unchanged.
    missing_file: This Gist has no resume.ohmycv.json. Upload with this app first.
    local_save: Saving failed or local files have conflicting changes. Resolve the save status and retry.
    storage: Your browser could not store sync settings. Enter them again after reloading.
    clipboard: "Cannot copy automatically. Select and copy the Gist URL manually."
